name: apptracer_flutter_aurora
description: Native Tracer integration for the Aurora OS Flutter embedder.
version: 2.0.0
publish_to: none
environment:
  sdk: ^3.11.1
  flutter: ">=3.41.4"
dependencies:
  flutter:
    sdk: flutter
  apptracer_flutter_platform_interface: ^0.3.1
  http: ^1.2.0
  sentry: 9.30.1
  aurora_client_wrapper: 1.17.1
flutter:
  plugin:
    platforms:
      aurora:
        dartPluginClass: AuroraTracerPlatform
        pluginEntryPointHeader: plugin.h
        pluginEntryPoint: ApptracerFlutterAuroraRegister
        requiresExclude:
          - tracernative
