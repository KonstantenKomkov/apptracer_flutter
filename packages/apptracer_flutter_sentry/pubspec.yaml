name: apptracer_flutter_sentry
description: >-
  Pure-Dart Sentry-protocol transport for apptracer_flutter. Delivers Dart
  errors to Tracer (apptracer.ru) on platforms where Tracer has no SDK of its
  own and documents the Sentry route instead.
version: 0.1.0
repository: https://github.com/KonstantenKomkov/apptracer_flutter
issue_tracker: https://github.com/KonstantenKomkov/apptracer_flutter/issues

topics:
  - crash-reporting
  - error-monitoring
  - sentry
  - tracer

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  apptracer_flutter_platform_interface: ^0.1.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.12.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
