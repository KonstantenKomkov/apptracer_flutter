name: apptracer_desktop_example
description: Windows/macOS acceptance example for the experimental Tracer desktop SDK adapter.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.5.0
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  apptracer_flutter: ^0.2.1
  apptracer_flutter_desktop:
    path: ..
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
