name: apptracer_flutter_desktop
description: Experimental official Sentry SDK adapter for Tracer on macOS, Windows and Ubuntu Linux.
version: 0.1.0-dev.1
publish_to: none
repository: https://github.com/KonstantenKomkov/apptracer_flutter
issue_tracker: https://github.com/KonstantenKomkov/apptracer_flutter/issues
topics:
  - crash-reporting
  - error-monitoring
  - tracer
environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'
dependencies:
  apptracer_flutter_platform_interface: ^0.2.0
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  sentry_flutter: 9.30.1
dev_dependencies:
  apptracer_flutter: ^0.2.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    implements: apptracer_flutter
    platforms:
      windows:
        dartPluginClass: SentryDesktopTracer
      linux:
        dartPluginClass: SentryDesktopTracer
        ffiPlugin: true
      macos:
        dartPluginClass: SentryDesktopTracer
        pluginClass: ApptracerDesktopPlugin
