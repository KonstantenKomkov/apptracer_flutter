name: apptracer_flutter_http
description: >-
  Pure-Dart HTTP transport for reporting Dart errors to Tracer (apptracer.ru).
  Used by the apptracer_flutter Web adapter and available for custom integrations.
version: 0.2.1
repository: https://github.com/KonstantenKomkov/apptracer_flutter
issue_tracker: https://github.com/KonstantenKomkov/apptracer_flutter/issues

topics:
  - crash-reporting
  - error-monitoring
  - observability
  - tracer

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  apptracer_flutter_platform_interface: ^0.2.0
  crypto: ^3.0.5
  flutter:
    sdk: flutter
  http: ^1.5.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
