name: Windows native runtime checks
on:
  push:
    branches: [main]
    paths:
      - 'tool/check_windows_native.py'
      - 'tool/check_windows_runtime.py'
      - 'tool/check_linux_runtime.py'
      - 'tool/tests/test_windows_native.py'
      - 'tool/check_windows_symbols.py'
      - 'tool/tests/test_windows_symbols.py'
      - '.github/workflows/windows-runtime.yml'
  workflow_run:
    workflows: ['Windows desktop preparation']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Windows preparation run from this branch (optional)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select a compiled release from the same branch
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            let run = context.payload.workflow_run;
            const branch = run ? run.head_branch : context.ref.replace('refs/heads/', '');
            if (!run) {
              const requested = context.payload.inputs?.build_run_id;
              if (requested) {
                if (!/^\d+$/.test(requested)) throw new Error('Invalid build run ID');
                run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(requested)})).data;
              } else {
                const result = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'windows.yml', branch, status: 'success', per_page: 20
                });
                run = result.data.workflow_runs.find(r => ['push', 'workflow_dispatch'].includes(r.event));
              }
              if (!run) throw new Error('No successful Windows release build on this branch');
            }
            if (run.head_branch !== branch || !['push', 'workflow_dispatch'].includes(run.event) || run.conclusion !== 'success' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` || !run.path.startsWith('.github/workflows/windows.yml')) {
              throw new Error('Refusing a release from an unrelated source');
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: run.id});
            if (!jobs.data.jobs.some(j => j.steps.some(s => s.name === 'Build release example' && s.conclusion === 'success'))) {
              throw new Error('Selected run has no successful release build');
            }
            core.setOutput('run', String(run.id));
            core.setOutput('sha', run.head_sha);
      - name: Verify artifact source matches current package code
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          git diff --exit-code $env:BUILD_SHA HEAD -- packages ':!**/*.md'
          if ($LASTEXITCODE -ne 0) { throw 'Package code changed; wait for its Windows build before reusing artifacts' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run }}
          name: windows-x64-preparation
          path: build/compiled
      - name: Check native crash and restart without debugger
        shell: pwsh
        run: |
          python -m unittest discover -s tool/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.exe | Select-Object -First 1
          if (-not $app) { throw 'Release executable missing from artifact' }
          foreach ($scenario in @('lifecycle', 'grouping', 'native', 'native-revoked', 'native-discard', 'native-inflight', 'dart-retry', 'dart-online', 'dart-revoked', 'dart-discard', 'missing-handler', 'unwritable-storage', 'missing-native-symbols', 'mismatched-native-symbols', 'junction-storage', 'concurrent-owner', 'readonly-bundle', 'junction-queue-entry')) {
            python -X utf8 tool/check_windows_runtime.py --app $app.Directory.FullName --scenario $scenario --output "build/windows-native/$scenario.json" --dump-directory build/windows-native/dumps
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare pinned local symbol tools
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force build/symbol-tools | Out-Null
          $symbolsUrl = 'https://github.com/mozilla/dump_syms/releases/download/v2.3.9/dump_syms-x86_64-pc-windows-msvc.zip'
          $symbolsArchive = 'build/symbol-tools/dump-syms.zip'
          Invoke-WebRequest -Uri $symbolsUrl -OutFile $symbolsArchive -TimeoutSec 120
          $symbolsHash = (Get-FileHash $symbolsArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($symbolsHash -ne 'bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7') { throw 'dump_syms archive checksum mismatch' }
          Expand-Archive -LiteralPath $symbolsArchive -DestinationPath build/symbol-tools/dump-syms
          $url = 'https://github.com/rust-minidump/rust-minidump/releases/download/v0.27.0/minidump-stackwalk-x86_64-pc-windows-msvc.zip'
          $archive = 'build/symbol-tools/stackwalk.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 120
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f6f2d7f1665843c4a270cd13fcd1458fed3b19013ea5dd909e12bc3599b959f4') { throw 'Stackwalk archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/symbol-tools/stackwalk
      - name: Match PDB and recover native runner source frames
        shell: pwsh
        run: |
          $app = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.exe | Select-Object -First 1
          $pdb = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.pdb | Select-Object -First 1
          $walker = Get-ChildItem build/symbol-tools/stackwalk -Recurse -Filter minidump-stackwalk.exe | Select-Object -First 1
          $dumper = Get-ChildItem build/symbol-tools/dump-syms -Recurse -Filter dump_syms.exe | Select-Object -First 1
          if (-not $app -or -not $pdb -or -not $walker -or -not $dumper) { throw 'Missing executable, exact PDB or symbol tool' }
          python tool/check_windows_symbols.py --app $app.Directory.FullName --pdb $pdb.FullName --dump-dir build/windows-native/dumps --dump-syms $dumper.FullName --stackwalk $walker.FullName --output build/windows-native/symbols 2>&1 | Tee-Object -FilePath symbols-probe.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content symbols-probe.log -Tail 30) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows symbols probe failed::$detail"
            exit 1
          }
          $result = Get-Content build/windows-native/symbols/report.json -Raw | ConvertFrom-Json
          foreach ($dump in $result.dumps) {
            $frame = $dump.frames[0]
            $detail = "$($dump.sha256): $($frame.function), $($frame.file):$($frame.line), trust=$($frame.trust)"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::notice title=Recovered runner source frame::$detail"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence
          path: |
            build/windows-native/
            native-probe.log
            symbols-probe.log
          retention-days: 14
