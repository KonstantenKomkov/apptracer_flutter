name: Windows native runtime checks
on:
  push:
    branches: [main]
    paths:
      - 'tool/check_windows_native.py'
      - 'tool/tests/test_windows_native.py'
      - 'tool/check_windows_symbols.py'
      - 'tool/tests/test_windows_symbols.py'
      - 'tool/prepare_aurora_sdk.py'
      - 'tool/aurora/sdk.lock.json'
      - '.github/workflows/windows-runtime.yml'
  workflow_run:
    workflows: ['Windows desktop preparation']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select a compiled main-branch release
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            let run = context.payload.workflow_run;
            if (!run) {
              const result = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'windows.yml', branch: 'main', status: 'success', per_page: 20
              });
              run = result.data.workflow_runs.find(r => r.event === 'push');
              // Bootstrap artifact: build passed; its receiver error was fixed
              // and the identical binary passed the three transport scenarios.
              if (!run) run = (await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: 39992634203
              })).data;
            }
            if (run.head_branch !== 'main' || run.event !== 'push' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Refusing a release from an unrelated source');
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: run.id});
            if (!jobs.data.jobs.some(j => j.steps.some(s => s.name === 'Build release example' && s.conclusion === 'success'))) {
              throw new Error('Selected run has no successful release build');
            }
            core.setOutput('run', String(run.id));
            core.setOutput('sha', run.head_sha);
      - name: Verify artifact source matches current package code
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          git diff --exit-code $env:BUILD_SHA HEAD -- packages ':!**/*.md'
          if ($LASTEXITCODE -ne 0) { throw 'Package code changed; wait for its Windows build before reusing artifacts' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run }}
          name: windows-x64-preparation
          path: build/compiled
      - name: Check native crash and restart without debugger
        shell: pwsh
        run: |
          python -m unittest discover -s tool/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.exe | Select-Object -First 1
          if (-not $app) { throw 'Release executable missing from artifact' }
          foreach ($mode in @('online', 'offline-restart')) {
            $probeArgs = @('--app', $app.Directory.FullName, '--output', "build/windows-native/$mode.json", '--dump-dir', 'build/windows-native/dumps')
            if ($mode -eq 'offline-restart') { $probeArgs += '--offline-restart' }
            python tool/check_windows_native.py @probeArgs 2>&1 | Tee-Object -FilePath native-probe.log -Append
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              $detail = (Get-Content native-probe.log -Tail 40) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows native $mode probe failed::$detail"
              exit $result
            }
          }
      - name: Prepare pinned local symbol tools
        shell: pwsh
        run: |
          # The audited vendor archive also includes its Windows dump_syms.
          # No Aurora runtime library is installed or executed on Windows.
          python tool/prepare_aurora_sdk.py --destination build/symbol-tools/tracer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $url = 'https://github.com/rust-minidump/rust-minidump/releases/download/v0.27.0/minidump-stackwalk-x86_64-pc-windows-msvc.zip'
          $archive = 'build/symbol-tools/stackwalk.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f6f2d7f1665843c4a270cd13fcd1458fed3b19013ea5dd909e12bc3599b959f4') { throw 'Stackwalk archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/symbol-tools/stackwalk
      - name: Match PDB and recover native runner source frames
        shell: pwsh
        run: |
          $app = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.exe | Select-Object -First 1
          $pdb = Get-ChildItem build/compiled -Recurse -Filter apptracer_desktop_example.pdb | Select-Object -First 1
          $walker = Get-ChildItem build/symbol-tools/stackwalk -Recurse -Filter minidump-stackwalk.exe | Select-Object -First 1
          if (-not $app -or -not $pdb -or -not $walker) { throw 'Missing executable, exact PDB or stackwalker' }
          python tool/check_windows_symbols.py --app $app.Directory.FullName --pdb $pdb.FullName --dump-dir build/windows-native/dumps --dump-syms build/symbol-tools/tracer/symupload/dump_syms/windows/dump_syms.exe --stackwalk $walker.FullName --output build/windows-native/symbols 2>&1 | Tee-Object -FilePath symbols-probe.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content symbols-probe.log -Tail 30) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows symbols probe failed::$detail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence
          path: |
            build/windows-native/
            native-probe.log
            symbols-probe.log
          retention-days: 14
