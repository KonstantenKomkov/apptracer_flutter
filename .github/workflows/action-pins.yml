name: Action commit pins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tool/check_action_pins.py'
      - 'tool/tests/test_action_pins.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tool/check_action_pins.py'
      - 'tool/tests/test_action_pins.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the action pin checker
        run: python3 -m unittest discover -s tool/tests -p test_action_pins.py
      - name: Check external action commit pins
        run: python3 tool/check_action_pins.py
