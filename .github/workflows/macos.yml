name: macOS desktop

on:
  push:
    branches: [main, 'codex/macos-*']
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'packages/apptracer_flutter/pubspec*.yaml'
      - 'tool/check_macos*.py'
      - 'tool/coverage_report.py'
      - 'tool/coverage_baseline.json'
      - 'tool/desktop_coverage_baseline.json'
      - 'tool/tests/test_coverage_report.py'
      - '.github/workflows/macos.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  pull_request:
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'packages/apptracer_flutter/pubspec*.yaml'
      - 'tool/check_macos*.py'
      - 'tool/coverage_report.py'
      - 'tool/coverage_baseline.json'
      - 'tool/desktop_coverage_baseline.json'
      - 'tool/tests/test_coverage_report.py'
      - '.github/workflows/macos.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  workflow_dispatch:
  workflow_call:
    outputs:
      versions:
        description: Resolved Sentry SDKs and toolchain from the release build
        value: ${{ jobs.macos.outputs.versions }}
    inputs:
      sentry_candidate:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    outputs:
      versions: ${{ steps.evidence.outputs.versions }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Sentry candidate in this disposable checkout
        if: inputs.sentry_candidate != ''
        env:
          SENTRY_CANDIDATE: ${{ inputs.sentry_candidate }}
        shell: bash
        run: python tool/sentry_candidate.py apply
      - name: Record toolchain and revision
        run: |
          mkdir -p build/macos-acceptance
          {
            git rev-parse HEAD
            uname -m
            sw_vers
            xcodebuild -version
            pod --version
            flutter --version
          } | tee build/macos-acceptance/toolchain.txt
      - name: Analyze and test adapter
        working-directory: packages/apptracer_flutter_desktop
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --coverage
      - name: Report macos adapter coverage
        run: python3 tool/coverage_report.py --desktop-only
      - name: Summarize desktop critical coverage
        if: always() && hashFiles('build/coverage/desktop-macos/summary.json') != ''
        run: |
          python3 - <<'PY'
          import json, os
          summary = json.load(open('build/coverage/desktop-macos/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('## Desktop critical coverage (macOS)\n')
              for name, entry in summary['critical'].items():
                  target.write(f"- {name}: {entry['covered']}/{entry['total']} "
                               f"({entry['ratio']:.1%}), delta {entry['deltaPercentagePoints']:+.2f} pp\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-coverage-macos
          path: build/coverage/desktop-macos
          if-no-files-found: error
      - name: Test native desktop storage
        working-directory: packages/apptracer_flutter_desktop
        run: |
          swiftc macos/Classes/DesktopStorage.swift macos/Classes/RevocableSession.swift test/native/main.swift -o "$RUNNER_TEMP/desktop-native-tests"
          "$RUNNER_TEMP/desktop-native-tests"
      - name: Build release example
        working-directory: packages/apptracer_flutter_desktop/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --release 2>&1 | tee macos-build.log
      - name: Identify compiled Sentry SDKs
        id: evidence
        if: inputs.sentry_candidate != ''
        env:
          SENTRY_CANDIDATE: ${{ inputs.sentry_candidate }}
        shell: bash
        run: python tool/sentry_candidate.py evidence
      - name: Test relocated release against loopback
        run: |
          app=packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release/apptracer_desktop_example.app
          for scenario in disabled deferred smoke native-crash; do
            python3 tool/check_macos_desktop.py --app "$app" --scenario "$scenario" --output "build/macos-acceptance/$scenario.json"
          done
          python3 tool/check_macos_lifecycle.py --app "$app" --output build/macos-acceptance/lifecycle.json
      - name: Build external consumer without monorepo overrides
        if: inputs.sentry_candidate == ''
        run: python3 tool/check_macos_consumer.py --output build/macos-consumer
      - name: Record binary and symbol identity
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release')
          records = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink():
                  kind = subprocess.check_output(['file', '-b', str(path)], text=True)
                  if 'Mach-O' in kind:
                      records.append({'path': str(path.relative_to(root)),
                                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                      'uuid': subprocess.check_output(['dwarfdump', '--uuid', str(path)], text=True).strip()})
          if not records:
              raise SystemExit('No Mach-O binaries found')
          pathlib.Path('build/macos-acceptance/binaries.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          # Keep executable modes and framework symlinks intact on download.
          ditto -c -k --sequesterRsrc --keepParent packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release build/macos-acceptance/release.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-arm64-acceptance
          path: |
            build/macos-acceptance/
            build/macos-consumer/
            packages/apptracer_flutter_desktop/example/pubspec.lock
            packages/apptracer_flutter_desktop/example/macos/Podfile.lock
            packages/apptracer_flutter_desktop/example/macos-build.log
          retention-days: 14
