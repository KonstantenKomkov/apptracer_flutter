name: macOS desktop

on:
  push:
    branches: [main, 'codex/macos-*']
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_macos*.py'
      - '.github/workflows/macos.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  pull_request:
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_macos*.py'
      - '.github/workflows/macos.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Record toolchain and revision
        run: |
          mkdir -p build/macos-acceptance
          {
            git rev-parse HEAD
            uname -m
            sw_vers
            xcodebuild -version
            pod --version
            flutter --version
          } | tee build/macos-acceptance/toolchain.txt
      - name: Analyze and test adapter
        working-directory: packages/apptracer_flutter_desktop
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          swiftc macos/Classes/DesktopStorage.swift macos/Classes/RevocableSession.swift test/native/main.swift -o "$RUNNER_TEMP/desktop-native-tests"
          "$RUNNER_TEMP/desktop-native-tests"
      - name: Build release example
        working-directory: packages/apptracer_flutter_desktop/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build macos --release 2>&1 | tee macos-build.log
      - name: Test relocated release against loopback
        run: |
          app=packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release/apptracer_desktop_example.app
          for scenario in disabled deferred smoke native-crash; do
            python3 tool/check_macos_desktop.py --app "$app" --scenario "$scenario" --output "build/macos-acceptance/$scenario.json"
          done
          python3 tool/check_macos_lifecycle.py --app "$app" --output build/macos-acceptance/lifecycle.json
      - name: Build external consumer without monorepo overrides
        run: python3 tool/check_macos_consumer.py --output build/macos-consumer
      - name: Record binary and symbol identity
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release')
          records = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink():
                  kind = subprocess.check_output(['file', '-b', str(path)], text=True)
                  if 'Mach-O' in kind:
                      records.append({'path': str(path.relative_to(root)),
                                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                      'uuid': subprocess.check_output(['dwarfdump', '--uuid', str(path)], text=True).strip()})
          if not records:
              raise SystemExit('No Mach-O binaries found')
          pathlib.Path('build/macos-acceptance/binaries.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          # Keep executable modes and framework symlinks intact on download.
          ditto -c -k --sequesterRsrc --keepParent packages/apptracer_flutter_desktop/example/build/macos/Build/Products/Release build/macos-acceptance/release.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-acceptance
          path: |
            build/macos-acceptance/
            build/macos-consumer/
            packages/apptracer_flutter_desktop/example/pubspec.lock
            packages/apptracer_flutter_desktop/example/macos/Podfile.lock
            packages/apptracer_flutter_desktop/example/macos-build.log
          retention-days: 14
