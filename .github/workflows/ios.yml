# The iOS half of the example, on its own trigger.
#
# A macOS runner bills at ten times a Linux one, and this three-minute job was
# two thirds of what this repository spends on Actions while running on every
# push — including the many that touch nothing but Dart, Gradle or prose. The
# paths filter below turns it into what it should have been: a check that runs
# when the iOS half of the package changes.
#
# A release of apptracer_flutter_ios always edits its pubspec.yaml, so a
# release commit still runs this. Markdown is excluded, so editing a README
# does not book a macOS runner.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "packages/apptracer_flutter_ios/**"
      - "packages/apptracer_flutter_platform_interface/**"
      - "packages/apptracer_flutter/lib/**"
      - "packages/apptracer_flutter/pubspec*.yaml"
      - "packages/apptracer_flutter/example/lib/**"
      - "packages/apptracer_flutter/example/pubspec*.yaml"
      - "packages/apptracer_flutter/example/ios/**"
      - ".github/workflows/ios.yml"
      - ".github/flutter-version"
      - "!**/*.md"
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  pull_request:
    paths:
      - "packages/apptracer_flutter_ios/**"
      - "packages/apptracer_flutter_platform_interface/**"
      - "packages/apptracer_flutter/lib/**"
      - "packages/apptracer_flutter/pubspec*.yaml"
      - "packages/apptracer_flutter/example/lib/**"
      - "packages/apptracer_flutter/example/pubspec*.yaml"
      - "packages/apptracer_flutter/example/ios/**"
      - ".github/workflows/ios.yml"
      - ".github/flutter-version"
      - "!**/*.md"
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  workflow_dispatch:

jobs:
  example:
    name: Example (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the reproducible Flutter baseline
        run: echo "FLUTTER_VERSION=$(cat .github/flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/apptracer_flutter/example
        run: flutter pub get

      # No code signing in CI, so the simulator build is what can be proven.
      - name: Build iOS
        working-directory: packages/apptracer_flutter/example
        run: flutter build ios --simulator --debug
