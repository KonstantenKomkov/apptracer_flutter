name: Documentation links

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'tool/check_markdown_links.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'tool/check_markdown_links.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links and anchors
        run: python3 tool/check_markdown_links.py
