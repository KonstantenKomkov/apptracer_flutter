name: Documentation links

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/tools/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/tools/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r docs/tools/requirements.txt
      - run: python3 -m unittest discover -s docs/tools
      - name: Check local Markdown links and anchors
        run: python3 docs/tools/check_markdown_links.py
