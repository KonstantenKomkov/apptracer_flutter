name: Documentation links

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/tools/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/tools/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r docs/tools/requirements.txt
      - run: python3 -m unittest discover -s docs/tools
      - name: Check local Markdown links and anchors
        run: python3 docs/tools/check_markdown_links.py
