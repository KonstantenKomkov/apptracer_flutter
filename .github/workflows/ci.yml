name: CI

on:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tool/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/actions/**'
      - '.github/flutter-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/flutter-baseline-update.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  pull_request:
    paths:
      - 'packages/**'
      - 'tool/**'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/actions/**'
      - '.github/flutter-version'
      - '.github/workflows/ci.yml'
      - '.github/workflows/flutter-baseline-update.yml'
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!**/LICENSE'
      - '!**/LICENSE.*'
      - '!**/NOTICE'
      - '!**/NOTICE.*'
      - '!**/.gitignore'
      - '!**/.gitattributes'
  workflow_dispatch:

# Run automatically for source, tests, dependencies and build configuration.
# Documentation and repository housekeeping alone do not need a runner.
# A crash reporter that only works on the maintainer's machine is worthless, so
# every claim the README makes about a platform is built here.
jobs:
  catalog:
    name: Package catalog
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.catalog.outputs.packages }}
      minimum: ${{ steps.catalog.outputs.minimum }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: |
          packages="$(python3 tool/package_catalog.py matrix)"
          minimum="$(python3 tool/package_catalog.py minimum)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "minimum=$minimum" >> "$GITHUB_OUTPUT"

  analyze:
    if: github.event_name != 'schedule'
    name: Analyze and test
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the reproducible Flutter baseline
        run: echo "FLUTTER_VERSION=$(cat .github/flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get

      - name: Check formatting
        working-directory: packages/${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze --fatal-infos

      - name: Set up Chrome
        id: setup-chrome
        if: matrix.chrome
        uses: browser-actions/setup-chrome@v2

      - name: Test
        env:
          PACKAGE: packages/${{ matrix.package }}
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path || '/usr/bin/google-chrome' }}
        run: python3 tool/test_package.py "$PACKAGE" --coverage

      - name: Verify checks did not modify sources
        run: bash tool/check_git_clean.sh

      - name: Upload coverage
        if: matrix.vm
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info

  minimum-flutter:
    if: github.event_name != 'schedule'
    name: Minimum Flutter 3.22.0
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.minimum) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get
      - name: Verify generated Pigeon contract
        if: matrix.package == 'apptracer_flutter_platform_interface'
        run: bash tool/generate_pigeon.sh --check

      - name: Check formatting
        working-directory: packages/${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze --fatal-infos
      - name: Set up Chrome
        id: setup-chrome-minimum
        if: matrix.chrome
        uses: browser-actions/setup-chrome@v2
      - name: Test
        env:
          PACKAGE: packages/${{ matrix.package }}
          CHROME_EXECUTABLE: ${{ steps.setup-chrome-minimum.outputs.chrome-path || '/usr/bin/google-chrome' }}
        run: python3 tool/test_package.py "$PACKAGE"

      - name: Verify checks did not modify sources
        run: bash tool/check_git_clean.sh

  latest-stable-canary:
    name: Latest stable canary (${{ matrix.package }})
    if: github.event_name != 'push'
    continue-on-error: true
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record canary toolchain
        run: flutter --version
      - name: Resolve dependencies
        id: resolve
        working-directory: packages/${{ matrix.package }}
        # Resolve Dart dependencies (including examples) without regenerating
        # native example projects with the canary SDK.
        run: dart pub get
      - name: Check formatting
        working-directory: packages/${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze --no-pub --fatal-infos
      - name: Set up Chrome
        id: setup-chrome-canary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' && matrix.chrome }}
        uses: browser-actions/setup-chrome@v2
      - name: Test
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        env:
          PACKAGE: packages/${{ matrix.package }}
          CHROME_EXECUTABLE: ${{ steps.setup-chrome-canary.outputs.chrome-path || '/usr/bin/google-chrome' }}
        run: python3 tool/test_package.py "$PACKAGE"

      - name: Verify checks did not modify sources
        if: ${{ !cancelled() }}
        run: bash tool/check_git_clean.sh

  example:
    if: github.event_name != 'schedule'
    name: Example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          # iOS is not here: a macOS runner bills at ten times a Linux one, and
          # that single job was two thirds of this repository's Actions spend
          # while the iOS half of the package changes a few times a year. It
          # lives in ios.yml, which runs when iOS files actually change.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the reproducible Flutter baseline
        run: echo "FLUTTER_VERSION=$(cat .github/flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/apptracer_flutter/example
        run: flutter pub get

      - name: Analyze and test the example
        working-directory: packages/apptracer_flutter/example
        run: |
          flutter analyze --fatal-infos
          flutter test --reporter=expanded

      # Built with obfuscation, because that is the configuration whose stack
      # traces are hardest to read and the one this package has to keep
      # decodable. The symbol file is kept as an artefact: without it the
      # release's Dart traces cannot be symbolicated, ever.
      - name: Build Android
        if: matrix.target == 'android'
        working-directory: packages/apptracer_flutter/example
        run: |
          # Clean first: an incremental build can leave the Dart AOT step
          # UP-TO-DATE and never regenerate the symbol file, producing a release
          # APK whose stack traces can never be decoded. See
          # docs/symbolication.md, finding 3.
          flutter clean
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      # Covers the Dart-frame to StackTraceElement mapping, which is what
      # Tracer groups Android events by.
      - name: Kotlin unit tests
        if: matrix.target == 'android'
        working-directory: packages/apptracer_flutter/example/android
        run: ./gradlew :apptracer_flutter_android:testDebugUnitTest

      - name: Verify the Dart symbol file matches libapp.so
        if: matrix.target == 'android'
        working-directory: packages/apptracer_flutter/example
        run: ../../../tool/verify_build_id.sh

      - name: Upload Dart symbols
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-android
          path: packages/apptracer_flutter/example/build/symbols
          retention-days: 90

      - name: Build web
        if: matrix.target == 'web'
        working-directory: packages/apptracer_flutter/example
        run: flutter build web --release --source-maps

      - name: Upload web source maps
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-source-maps
          path: packages/apptracer_flutter/example/build/web/*.map
          retention-days: 90

      - name: Verify checks did not modify sources
        run: bash tool/check_git_clean.sh

  coverage:
    name: Combined Dart coverage
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-input
      - name: Merge coverage and compare critical files
        run: |
          for directory in coverage-input/coverage-*; do
            package="${directory##*coverage-}"
            mkdir -p "packages/$package/coverage"
            cp "$directory/lcov.info" "packages/$package/coverage/lcov.info"
          done
          python3 tool/coverage_report.py
          jq -r '.critical | to_entries[] |
            "- \(.key): \(.value.covered)/\(.value.total) lines, change \((.value.deltaPercentagePoints * 100 | round) / 100) pp"' \
            build/coverage/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload one coverage report
        uses: actions/upload-artifact@v4
        with:
          name: dart-coverage
          path: build/coverage
          retention-days: 30

  publish-dry-run:
    if: github.event_name != 'schedule'
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    # Required archive and metadata check, using local sibling overrides.
    # Hosted dependency resolution is checked separately at release.
    #
    # One job rather than a package matrix: the command is identical bar the
    # directory, and each matrix leg was paying for a runner and a Flutter
    # install to run something that takes half a minute.
    steps:
      - uses: actions/checkout@v4
      - name: Read the reproducible Flutter baseline
        run: echo "FLUTTER_VERSION=$(cat .github/flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Every package is tried even after one fails, which is what the matrix's
      # fail-fast: false used to give.
      - name: Dry run
        run: |
          failed=0
          packages="$(python3 tool/package_catalog.py publish)"
          while IFS= read -r package; do
            echo "::group::$package"
            bash tool/publish_dry_run.sh "$package" || {
              failed=1
              echo "::error::dry run failed for $package"
            }
            echo "::endgroup::"
          done <<< "$packages"
          exit "$failed"

      - name: Verify dry run did not modify sources
        run: bash tool/check_git_clean.sh

  android-configuration-cache:
    if: github.event_name != 'schedule'
    name: Android SDK 1.6.2 configuration cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          # Audited toolchain for this gate; other jobs retain their baseline.
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Install audited Android platforms
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"
      - name: Strict cache reuse and invalidation
        run: |
          python3 tool/check_android_configuration_cache.py \
            --output "$RUNNER_TEMP/tracer-configuration-cache"
      - name: Upload cache evidence and explicit Flutter limitation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-configuration-cache
          path: |
            ${{ runner.temp }}/tracer-configuration-cache/*.json
            ${{ runner.temp }}/tracer-configuration-cache/*.log
            ${{ runner.temp }}/tracer-configuration-cache/native-*/*.log
          retention-days: 14
