name: Windows desktop preparation

on:
  push:
    branches: [main]
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_*desktop.py'
      - 'tool/build_windows_desktop.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_*desktop.py'
      - 'tool/build_windows_desktop.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/tool/build_windows_desktop.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw ($parseErrors -join "`n") }
          flutter doctor -v
      - name: Resolve and analyze adapter
        working-directory: packages/apptracer_flutter_desktop
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_configuration_test.dart
          exit $LASTEXITCODE
      - name: Build release example
        working-directory: packages/apptracer_flutter_desktop/example
        env:
          APPTRACER_NATIVE_DEPS_DIR: '${{ runner.temp }}/tracer-native'
        run: |
          function Invoke-Flutter {
            & flutter @args 2>&1 | Tee-Object -FilePath windows-build.log
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              # Public annotations retain the useful failure when Actions logs
              # require an authenticated reader. No credentials enter this job.
              $detail = (Get-Content windows-build.log -Tail 45) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows example failed::$detail"
              exit $result
            }
          }
          Invoke-Flutter pub get
          Invoke-Flutter analyze --fatal-infos
          Invoke-Flutter test
          Invoke-Flutter build windows --release
      - name: Test relocated release against loopback
        run: |
          foreach ($scenario in @('disabled', 'deferred', 'smoke')) {
            python tool/check_windows_desktop.py --app packages/apptracer_flutter_desktop/example/build/windows/x64/runner/Release --scenario $scenario --output "build/windows-acceptance/$scenario.json" 2>&1 | Tee-Object -FilePath probe.log
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              $detail = (Get-Content probe.log -Tail 30) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows $scenario probe failed::$detail"
              exit $result
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-preparation
          path: |
            build/windows-acceptance/
            packages/apptracer_flutter_desktop/example/build/windows/x64/runner/Release/
            packages/apptracer_flutter_desktop/example/build/symbols/native/
            packages/apptracer_flutter_desktop/example/pubspec.lock
            packages/apptracer_flutter_desktop/example/windows-build.log
          retention-days: 14
