name: Windows desktop preparation

on:
  push:
    branches: [main]
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_*desktop.py'
      - 'tool/*windows*'
      - 'tool/*linux*'
      - 'tool/elf_build_id.py'
      - 'tool/build_windows_desktop.ps1'
      - 'tool/tests/test_desktop_receiver.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'packages/apptracer_flutter_desktop/**'
      - 'packages/apptracer_flutter_platform_interface/**'
      - 'packages/apptracer_flutter/lib/**'
      - 'tool/check_*desktop.py'
      - 'tool/*windows*'
      - 'tool/*linux*'
      - 'tool/elf_build_id.py'
      - 'tool/build_windows_desktop.ps1'
      - 'tool/tests/test_desktop_receiver.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      SENTRY_NATIVE_BACKEND: native
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/tool/build_windows_desktop.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw ($parseErrors -join "`n") }
          flutter doctor -v
      - name: Resolve and analyze adapter
        working-directory: packages/apptracer_flutter_desktop
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          exit $LASTEXITCODE
      - name: Build release example
        working-directory: packages/apptracer_flutter_desktop/example
        env:
          APPTRACER_NATIVE_DEPS_DIR: '${{ runner.temp }}/tracer-native'
        run: |
          function Invoke-Flutter {
            & flutter @args 2>&1 | Tee-Object -FilePath windows-build.log
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              # Public annotations retain the useful failure when Actions logs
              # require an authenticated reader. No credentials enter this job.
              $detail = (Get-Content windows-build.log -Tail 45) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows example failed::$detail"
              exit $result
            }
          }
          Invoke-Flutter pub get
          Invoke-Flutter analyze --fatal-infos
          Invoke-Flutter test
          Invoke-Flutter build windows --release --obfuscate --split-debug-info=build/symbols/dart
      - name: Bundle exact-build Dart and native source maps
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force build/symbol-tools | Out-Null
          $archive = 'build/symbol-tools/dump-syms.zip'
          Invoke-WebRequest -Uri 'https://github.com/mozilla/dump_syms/releases/download/v2.3.9/dump_syms-x86_64-pc-windows-msvc.zip' -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7') { throw 'dump_syms checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/symbol-tools/dump-syms
          $dumper = Get-ChildItem build/symbol-tools/dump-syms -Recurse -Filter dump_syms.exe | Select-Object -First 1
          $example = 'packages/apptracer_flutter_desktop/example'
          $bundle = "$example/build/windows/x64/runner/Release"
          python -X utf8 tool/prepare_windows_runtime_symbols.py --bundle $bundle --pdb "$example/build/symbols/native/apptracer_desktop_example.pdb" --dump-syms $dumper.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tool/prepare_linux_dart_runtime_symbols.py --windows --bundle $bundle --symbols "$example/build/symbols/dart/app.windows-x64.symbols" --dump-syms $dumper.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @('resolved', 'missing', 'mismatched')) {
            python -X utf8 tool/check_linux_dart_display.py --windows --app $bundle --mode $mode --output "build/windows-acceptance/dart-$mode.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test relocated release against loopback
        run: |
          python -m unittest discover -s tool/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in @('disabled', 'deferred', 'smoke')) {
            python tool/check_windows_desktop.py --app packages/apptracer_flutter_desktop/example/build/windows/x64/runner/Release --scenario $scenario --output "build/windows-acceptance/$scenario.json" 2>&1 | Tee-Object -FilePath probe.log
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              $detail = (Get-Content probe.log -Tail 30) -join "`n"
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows $scenario probe failed::$detail"
              exit $result
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-preparation
          path: |
            build/windows-acceptance/
            packages/apptracer_flutter_desktop/example/build/windows/x64/runner/Release/
            packages/apptracer_flutter_desktop/example/build/symbols/native/
            packages/apptracer_flutter_desktop/example/build/symbols/dart/
            packages/apptracer_flutter_desktop/example/pubspec.lock
            packages/apptracer_flutter_desktop/example/windows-build.log
          retention-days: 14
